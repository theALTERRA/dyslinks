# Dyslinks — MariaDB + Redis
#
# Quick start:
#   1. Copy .example.env to .env and set JWT_SECRET, DEFAULT_DOMAIN, and DB_PASSWORD
#   2. Run: docker compose -f docker-compose.mariadb.yml up -d

services:
  dyslinks:
    image: ghcr.io/thealterra/dyslinks:latest
    container_name: dyslinks
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (generate with: openssl rand -hex 32)}
      SITE_NAME: ${SITE_NAME:-Dyslinks}
      DEFAULT_DOMAIN: ${DEFAULT_DOMAIN:-localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      ENABLE_RATE_LIMIT: ${ENABLE_RATE_LIMIT:-true}
      DISALLOW_ANONYMOUS_LINKS: ${DISALLOW_ANONYMOUS_LINKS:-true}
      DISALLOW_REGISTRATION: ${DISALLOW_REGISTRATION:-true}
      DB_CLIENT: mysql2
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-dyslinks}
      DB_USER: ${DB_USER:-dyslinks}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - custom:/dyslinks/custom
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  mariadb:
    image: mariadb:10.11
    container_name: dyslinks-mariadb
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="${DB_PASSWORD}" mariadb-admin ping -h localhost -u "${DB_USER:-dyslinks}"']
      interval: 3s
      retries: 5
      start_period: 30s
    volumes:
      - db_data_mariadb:/var/lib/mysql
    environment:
      MARIADB_DATABASE: ${DB_NAME:-dyslinks}
      MARIADB_USER: ${DB_USER:-dyslinks}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD:?Set DB_PASSWORD in .env}}
    expose:
      - 3306

  redis:
    image: redis:7-alpine
    container_name: dyslinks-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data_mariadb:
  custom:
