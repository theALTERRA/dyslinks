services:
  server:
    image: ghcr.io/thealterra/dyslinks:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - custom:/dyslinks/custom
    environment:
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_ENABLED: true
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - 3000:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - db_data_pg:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_DB: ${DB_NAME:-dyslinks}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    expose:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-dyslinks}"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:alpine
    restart: unless-stopped
    expose:
      - 6379
volumes:
  db_data_pg:
  custom:
