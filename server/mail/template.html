<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta name="color-scheme" content="dark" />
    <meta name="supported-color-schemes" content="dark" />
    <title>{{title}}</title>
    <!--[if gte mso 9]>
      <xml>
        <o:OfficeDocumentSettings>
          <o:AllowPNG />
          <o:PixelsPerInch>96</o:PixelsPerInch>
        </o:OfficeDocumentSettings>
      </xml>
    <![endif]-->
    <style type="text/css">
      :root {
        color-scheme: dark;
        supported-color-schemes: dark;
      }

      html,
      body {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        background-color: #09090b !important;
      }

      * {
        -ms-text-size-adjust: 100%;
        -webkit-text-size-adjust: 100%;
      }

      table,
      td {
        mso-table-lspace: 0pt !important;
        mso-table-rspace: 0pt !important;
      }

      .email-card {
        border-collapse: separate !important;
      }

      a[x-apple-data-detectors],
      .unstyle-auto-detected-links a,
      #MessageViewBody a {
        color: inherit !important;
        text-decoration: none !important;
        font-size: inherit !important;
        font-family: inherit !important;
        font-weight: inherit !important;
        line-height: inherit !important;
      }

      @media only screen and (max-width: 600px) {
        .email-outer {
          padding: 20px 12px !important;
        }

        .email-card-pad {
          padding-left: 24px !important;
          padding-right: 24px !important;
        }

        .email-heading {
          font-size: 24px !important;
          line-height: 1.25 !important;
        }
      }

      @media (forced-colors: active) {
        .email-card {
          border: 1px solid CanvasText !important;
        }

        .email-cta {
          border: 2px solid ButtonText !important;
        }
      }
    </style>
  </head>
  <body bgcolor="#09090b" style="margin:0;padding:0;width:100%;background-color:#09090b;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:#f4f4f5;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;font-size:1px;line-height:1px;color:#09090b;mso-hide:all;">
      {{preheader}}&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;
    </div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#09090b" style="width:100%;background-color:#09090b;border-collapse:collapse;border-spacing:0;">
      <tr>
        <td align="center" valign="top" class="email-outer" style="padding:32px 16px;">
          <!--[if mso]>
          <table role="presentation" align="center" border="0" cellspacing="0" cellpadding="0" width="540">
            <tr>
              <td align="center" valign="top" width="540">
          <![endif]-->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0c0c0f" class="email-card" style="width:100%;max-width:540px;background-color:#0c0c0f;border:1px solid #222229;border-radius:16px;border-collapse:separate;border-spacing:0;">
            <tr>
              <td align="center" class="email-card-pad" style="padding:52px 44px 36px 44px;">
                <a href="{{site_url}}" target="_blank" rel="noopener noreferrer" style="display:inline-block;text-decoration:none;color:#ffffff;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="40" height="40" align="center" aria-hidden="true" style="border-collapse:collapse;border-spacing:0;margin:0 auto;width:40px;height:40px;table-layout:fixed;">
                    <tr>
                      <td width="8" height="8" bgcolor="#ffffff" style="width:8px;height:8px;background-color:#ffffff;font-size:0;line-height:0;padding:0;mso-line-height-rule:exactly;">&nbsp;</td>
                      <td width="16" height="8" bgcolor="#ffffff" style="width:16px;height:8px;background-color:#ffffff;font-size:0;line-height:0;padding:0;mso-line-height-rule:exactly;">&nbsp;</td>
                      <td width="8" height="8" style="width:8px;height:8px;font-size:0;line-height:0;padding:0;mso-line-height-rule:exactly;">&nbsp;</td>
                      <td width="8" height="8" style="width:8px;height:8px;font-size:0;line-height:0;padding:0;mso-line-height-rule:exactly;">&nbsp;</td>
                    </tr>
                    <tr>
                      <td width="8" height="24" bgcolor="#ffffff" style="width:8px;height:24px;background-color:#ffffff;font-size:0;line-height:0;padding:0;mso-line-height-rule:exactly;">&nbsp;</td>
                      <td width="16" height="24" style="width:16px;height:24px;font-size:0;line-height:0;padding:0;mso-line-height-rule:exactly;">&nbsp;</td>
                      <td width="8" height="24" bgcolor="#ffffff" style="width:8px;height:24px;background-color:#ffffff;font-size:0;line-height:0;padding:0;mso-line-height-rule:exactly;">&nbsp;</td>
                      <td width="8" height="24" style="width:8px;height:24px;font-size:0;line-height:0;padding:0;mso-line-height-rule:exactly;">&nbsp;</td>
                    </tr>
                    <tr>
                      <td width="8" height="8" bgcolor="#ffffff" style="width:8px;height:8px;background-color:#ffffff;font-size:0;line-height:0;padding:0;mso-line-height-rule:exactly;">&nbsp;</td>
                      <td width="16" height="8" bgcolor="#ffffff" style="width:16px;height:8px;background-color:#ffffff;font-size:0;line-height:0;padding:0;mso-line-height-rule:exactly;">&nbsp;</td>
                      <td width="8" height="8" style="width:8px;height:8px;font-size:0;line-height:0;padding:0;mso-line-height-rule:exactly;">&nbsp;</td>
                      <td width="8" height="8" bgcolor="#8b5cf6" style="width:8px;height:8px;background-color:#8b5cf6;font-size:0;line-height:0;padding:0;mso-line-height-rule:exactly;">&nbsp;</td>
                    </tr>
                  </table>
                  <div style="margin-top:14px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:22px;font-weight:700;line-height:1.2;letter-spacing:-0.02em;color:#ffffff;text-align:center;">
                    {{site_name}}
                  </div>
                </a>
              </td>
            </tr>

            <tr>
              <td align="center" class="email-card-pad" style="padding:12px 44px 20px 44px;">
                <h1 class="email-heading" style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:28px;font-weight:700;line-height:1.25;letter-spacing:-0.025em;color:#ffffff;text-align:center;">
                  {{heading_html}}
                </h1>
              </td>
            </tr>

            <tr>
              <td align="center" class="email-card-pad unstyle-auto-detected-links" style="padding:0 44px 36px 44px;">
                <p style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:15px;font-weight:400;line-height:1.65;color:#a1a1aa;text-align:center;">
                  {{body_html}}
                </p>
              </td>
            </tr>

            {{action_block}}
            {{detail_block}}

            <tr>
              <td class="email-card-pad" style="padding:44px 44px 0 44px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;">
                  <tr>
                    <td style="border-top:1px solid #1f1f27;font-size:0;line-height:0;height:1px;">&nbsp;</td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td align="center" class="email-card-pad" style="padding:24px 44px 32px 44px;">
                <a href="https://github.com/theALTERRA/dyslinks" target="_blank" rel="noopener noreferrer" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:13px;font-weight:400;line-height:1.5;color:#8e8e9a;text-decoration:none;">
                  Powered by Dyslinks
                </a>
              </td>
            </tr>
          </table>
          <!--[if mso]>
              </td>
            </tr>
          </table>
          <![endif]-->
        </td>
      </tr>
    </table>
  </body>
</html>
