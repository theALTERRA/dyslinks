# Dyslinks — SQLite + Redis
#
# Quick start:
#   1. Copy .example.env to .env and set JWT_SECRET + DEFAULT_DOMAIN
#   2. Run: docker compose -f docker-compose.sqlite-redis.yml up -d

services:
  dyslinks:
    image: ghcr.io/thealterra/dyslinks:latest
    container_name: dyslinks
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (generate with: openssl rand -hex 32)}
      SITE_NAME: ${SITE_NAME:-Dyslinks}
      DEFAULT_DOMAIN: ${DEFAULT_DOMAIN:-localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      ENABLE_RATE_LIMIT: ${ENABLE_RATE_LIMIT:-true}
      DISALLOW_ANONYMOUS_LINKS: ${DISALLOW_ANONYMOUS_LINKS:-true}
      DISALLOW_REGISTRATION: ${DISALLOW_REGISTRATION:-true}
      DB_FILENAME: /var/lib/dyslinks/data.sqlite
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - db_data_sqlite:/var/lib/dyslinks
      - custom:/dyslinks/custom
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:alpine
    container_name: dyslinks-redis
    restart: unless-stopped
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data_sqlite:
  custom:
