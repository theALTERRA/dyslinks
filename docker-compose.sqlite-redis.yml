services:
  server:
    image: ghcr.io/thealterra/dyslinks:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - db_data_sqlite:/var/lib/dyslinks
      - custom:/dyslinks/custom
    environment:
      DB_FILENAME: "/var/lib/dyslinks/data.sqlite"
      REDIS_ENABLED: true
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - 3000:3000
    depends_on:
      redis:
        condition: service_started
  redis:
    image: redis:alpine
    restart: unless-stopped
    expose:
      - 6379
volumes:
  db_data_sqlite:
  custom:
