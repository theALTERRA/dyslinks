# dyslinks — SQLite (default, simplest setup)
#
# Quick start:
#   1. Copy .example.env to .env (or set the variables below directly)
#   2. Set JWT_SECRET (generate with: openssl rand -hex 32) and DEFAULT_DOMAIN
#   3. Run: docker compose up -d

services:
  dyslinks:
    image: ghcr.io/thealterra/dyslinks:latest
    container_name: dyslinks
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Required in production (minimum 32 random characters)
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (generate with: openssl rand -hex 32)}
      # Site branding & public domain
      SITE_NAME: ${SITE_NAME:-dyslinks}
      DEFAULT_DOMAIN: ${DEFAULT_DOMAIN:-localhost:3000}
      # Security & proxy defaults
      TRUST_PROXY: ${TRUST_PROXY:-true}
      ENABLE_RATE_LIMIT: ${ENABLE_RATE_LIMIT:-true}
      DISALLOW_ANONYMOUS_LINKS: ${DISALLOW_ANONYMOUS_LINKS:-true}
      DISALLOW_REGISTRATION: ${DISALLOW_REGISTRATION:-true}
      # SQLite database path inside the persistent volume
      DB_FILENAME: /var/lib/dyslinks/data.sqlite
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - db_data_sqlite:/var/lib/dyslinks
      - custom:/dyslinks/custom

volumes:
  db_data_sqlite:
  custom:
